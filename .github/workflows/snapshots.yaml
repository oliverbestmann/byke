name: Snapshots
on:
  push:
  pull_request:

jobs:
  Verify:
    strategy:
      fail-fast: false

      matrix:
        config:
          - runner: ubuntu-26.04-arm
            goexperiment: "simd"

    runs-on: "${{ matrix.config.runner }}"

    env:
      GOEXPERIMENT: "${{ matrix.config.goexperiment }}"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Install nix"
        uses: cachix/install-nix-action@v31

      # the test shell pins go and mesa's lavapipe, so the snapshot hashes match local runs
      - name: "Run examples"
        run: |
          nix develop ./nix#test -c ./run-example-test-all.sh

      - name: "Upload images to github"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: 'warn'
          name: 'snapshots'
          path: images/*.png
