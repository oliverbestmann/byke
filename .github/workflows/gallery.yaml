name: Gallery
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  Build:
    runs-on: ubuntu-26.04-arm

    env:
      GOEXPERIMENT: "simd"

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v7

      - name: "Setup Go"
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: "Install dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -f -y libegl1-mesa-dev mesa-vulkan-drivers \
            libasound2-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            libxkbcommon-dev libwayland-dev binaryen

      - name: "Install byke-cli"
        run: |
          go install github.com/oliverbestmann/byke-cli@main

      # thumbnails are named by a hash of their example, the gallery only renders missing ones
      - name: "Restore thumbnails"
        uses: actions/cache@v6
        with:
          path: gallery-thumbs
          key: gallery-thumbs-${{ hashFiles('byke2d/examples/**') }}
          restore-keys: gallery-thumbs-

      - name: "Build gallery"
        run: |
          go run ./internal/gallery -examples byke2d/examples -thumbs gallery-thumbs -out site

      - name: "Upload pages artifact"
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  Deploy:
    needs: Build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: "Deploy to GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v5
